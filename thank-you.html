<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Thank You | Renatus</title>

  <meta
    name="description"
    content="Thank you for contacting Renatus. Your message has been received."
  >

  <!-- Prevent confirmation pages from appearing in search results -->
  <meta name="robots" content="noindex, follow">

  <!-- Favicons -->
  <link
    rel="icon"
    href="/images/logos/favicon.ico"
    sizes="any"
  >
  <link
    rel="icon"
    type="image/png"
    sizes="48x48"
    href="/images/logos/favicon-48x48.png"
  >
  <link
    rel="icon"
    type="image/png"
    sizes="32x32"
    href="/images/logos/favicon-32x32.png"
  >
  <link
    rel="apple-touch-icon"
    href="/images/logos/apple-touch-icon.png"
  >

  <!-- Site styles -->
  <link rel="stylesheet" href="/css/site.css">

  <!-- Google Analytics -->
  <script
    async
    src="https://www.googletagmanager.com/gtag/js?id=G-SEEZLWF1YV"
  ></script>

  <script>
    window.dataLayer = window.dataLayer || [];

    function gtag() {
      dataLayer.push(arguments);
    }

    gtag("js", new Date());
    gtag("config", "G-SEEZLWF1YV");
  </script>
</head>

<body
  data-ga-confirm-lead="contact"
  data-ga-lead-source="Renatus contact form"
>

  <!-- Shared navigation -->
  <div id="site-header"></div>

  <main>

    <section class="section">
      <div class="container">

        <div class="card">

          <p class="section-kicker">
            Message Received
          </p>

          <h1 class="section-title">
            Thank You for Contacting Renatus
          </h1>

          <p class="section-subtitle">
            Your message has been successfully received.
            I’ll review the details you submitted and follow
            up with you as soon as possible.
          </p>

          <p>
            In the meantime, you can explore Renatus products,
            services, and recent work.
          </p>

          <div>
            <a
              href="/"
              class="btn btn-primary"
            >
              Return Home
            </a>

            <a
              href="/products"
              class="btn btn-outline"
            >
              Explore Products
            </a>
          </div>

        </div>

      </div>
    </section>

  </main>

  <!-- Shared footer -->
  <footer
    id="site-footer"
    class="site-footer"
  ></footer>

  <!-- JavaScript -->
  <script src="/js/components.js"></script>
  <script src="/js/site.js"></script>
  <script src="/js/analytics.js"></script>

</body>
</html>
